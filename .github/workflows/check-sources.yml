name: Check sources
# Weekly: re-read the official pages behind the "How to read a moving quote" guide.
# - Nothing changed and every fact is still stated: refresh the "checked on" date by itself (tests and build run first).
# - Something changed or a page could not be read: open (or update) one issue with the details, change nothing.
# - Pages that block automated downloads (FMCSA) are re-read by hand: an issue reminds 30 days before the page warns readers.
# - A later run that verifies again closes the issue by itself.
on:
  push:
    branches: ["feature/source-freshness"] # temporary: first real run on the runner, removed before merge
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check-sources
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the sources
        id: check
        run: node tools/check-sources.mjs --write --report source-report.md

      - name: Test and build before publishing the new date
        if: steps.check.outputs.status == 'verified' || steps.check.outputs.status == 'baseline'
        run: |
          npm ci
          npm test
          npm run build
          node tools/verify-seo.mjs

      - name: Publish the refreshed date
        if: github.ref == 'refs/heads/main' && (steps.check.outputs.status == 'verified' || steps.check.outputs.status == 'baseline')
        run: |
          if git diff --quiet -- data/source-checks.json; then echo "Nothing to commit."; exit 0; fi
          git config user.name "source-check[bot]"
          git config user.email "source-check@users.noreply.github.com"
          git add data/source-checks.json
          git commit -m "Refresh the source check date (${{ steps.check.outputs.status }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open or update an issue when a person is needed
        if: github.ref == 'refs/heads/main' && (steps.check.outputs.status == 'changed' || steps.check.outputs.status == 'failed' || steps.check.outputs.manual_due == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-check --color B60205 --description "Official source changed or could not be read" --force
          number=$(gh issue list --label source-check --state open --json number --jq '.[0].number // empty')
          title="Sources need review: ${{ steps.check.outputs.status }}, manual due ${{ steps.check.outputs.manual_due }} ($(date -u +%F))"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file source-report.md
          else
            gh issue create --label source-check --title "$title" --body-file source-report.md
          fi

      - name: Close the issue once the sources verify again
        if: github.ref == 'refs/heads/main' && (steps.check.outputs.status == 'verified' || steps.check.outputs.status == 'baseline') && steps.check.outputs.manual_due != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label source-check --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The sources verify again (automatic check). Closing."
          done
