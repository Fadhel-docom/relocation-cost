name: Bootstrap package lock

on:
  push:
    branches: ["p0-seo-fixes"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=true
      - run: python -m pip install pillow
      - run: python tools/make-og.py
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json public/og-default.png; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/og-default.png
          git commit -m "chore: add package lock"
          git push
