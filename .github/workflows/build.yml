name: Build
on:
  push:
    branches: ["main", "p0-seo-fixes"]
  pull_request:
    branches: ["main", "p0-seo-fixes"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node tools/verify-seo.mjs
