name: B24 PADD allocation tests

on:
  pull_request:
    paths:
      - "tools/b24_padd_allocation.py"
      - "tools/test_b24_padd_allocation.py"
      - ".github/workflows/b24-padd-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/b24_padd_allocation.py"
      - "tools/test_b24_padd_allocation.py"
      - ".github/workflows/b24-padd-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PADD allocation tests
        run: python -m unittest tools.test_b24_padd_allocation -v
