name: Expansion routes
# Manual only. Asks openrouteservice (HeiGIT) for home-country road distances between a country's main
# cities (data/expansion/<set>/cities.json) and stores each set on the branch "data/expansion-<set>".
# Data only: nothing on main changes and the website never reads these files.
# Needs the repository secret ORS_API_KEY. Resumable: rerun to continue after a stop.
# Several sets can be given at once (comma separated); they run one after the other.
on:
  workflow_dispatch:
    inputs:
      sets:
        description: "Country sets (folders under data/expansion), comma separated, two letters each. Example: nl,at,be"
        type: string
        default: "uk"
      recheck:
        description: "true = ask again, avoiding the foreign country, every stored route that touches one"
        type: string
        default: "false"
      probe:
        description: "Optional 'set:pair' (for example at:salzburg|innsbruck): write the raw countryinfo answer to probe.json"
        type: string
        default: ""
      max_requests:
        description: "Maximum Directions requests per set (daily quota is 2000, shared by all sets of the day)"
        type: string
        default: "700"

permissions:
  contents: write

concurrency:
  group: expansion-routes
  cancel-in-progress: false

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ask for the routes and publish each set to its own branch
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          SETS: ${{ inputs.sets }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          RECHECK: ${{ inputs.recheck }}
          PROBE: ${{ inputs.probe }}
        run: |
          set -u
          git config user.name "expansion-routes[bot]"
          git config user.email "expansion-routes@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          STATUS=0
          for s in $(echo "$SETS" | tr ',' ' '); do
            if ! echo "$s" | grep -Eq '^[a-z]{2}$'; then echo "Skipping invalid set '$s'"; STATUS=1; continue; fi
            if [ ! -f "data/expansion/$s/cities.json" ]; then echo "No cities file for '$s'"; STATUS=1; continue; fi
            git fetch origin "data/expansion-$s" 2>/dev/null || true
            if git rev-parse --verify "origin/data/expansion-$s" >/dev/null 2>&1; then
              git show "origin/data/expansion-$s:data/expansion/$s/routes.json" > "data/expansion/$s/routes.json" 2>/dev/null || rm -f "data/expansion/$s/routes.json"
            fi
            EXTRA=""
            [ "$RECHECK" = "true" ] && EXTRA="--recheck=true"
            case "$PROBE" in "$s":*) EXTRA="$EXTRA --probe=${PROBE#*:}";; esac
            node tools/expansion/home-routes.mjs --set="$s" --max-requests="$MAX_REQUESTS" $EXTRA || STATUS=1
            if [ -f "data/expansion/$s/routes.json" ]; then
              git switch -q -C "data/expansion-$s"
              git add "data/expansion/$s/routes.json"
              [ -f "data/expansion/$s/probe.json" ] && git add "data/expansion/$s/probe.json"
              if git diff --cached --quiet; then echo "Nothing new to publish for $s."; else
                git commit -q -m "data: expansion routes $s"
                git push --force origin "data/expansion-$s"
              fi
              git switch -q --detach "$BASE"
            fi
          done
          exit $STATUS
