name: Gemini Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create diff
        run: |
          git diff HEAD^ HEAD > changes.diff || git show --format= HEAD > changes.diff
          head -c 100000 changes.diff > review.diff

      - name: Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          diff = Path("review.diff").read_text(errors="replace")
          prompt = """Review this Relocation Cost code change as a secondary engineering reviewer.
Check for bugs, calculator errors, SEO/indexing risks, UX/accessibility, security, performance, and unsupported data claims.
Give concise findings grouped by Critical, Important, Nice-to-have, and Tests.
Do not invent facts.
DIFF:
""" + diff
          Path("request.json").write_text(json.dumps({"model":"gemini-3.8-flash","input":prompt}))
          PY
          curl --fail-with-body -sS -X POST "https://generativelanguage.googleapis.com/v1beta/interactions"             -H "x-goog-api-key: $GEMINI_API_KEY"             -H "Content-Type: application/json"             --data-binary @request.json > response.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("response.json").read_text())
          out=d.get("output_text","")
          if not out:
            for s in d.get("steps",[]):
              if s.get("type")=="model_output":
                out += "\n".join(x.get("text","") for x in s.get("content",[]) if x.get("type")=="text")
          Path("gemini-review.md").write_text(out or "No review returned.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gemini-review
          path: gemini-review.md
          retention-days: 14
