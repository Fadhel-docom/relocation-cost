name: Fetch B24 route geometries

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to use as the source of route definitions
        required: true
        default: main
        type: string
      route_set:
        description: Which existing route definitions to fetch
        required: true
        default: all
        type: choice
        options:
          - all
          - cities
          - states
      force:
        description: Re-fetch geometries even when files already exist
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out route definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch route geometries from HeiGIT
        env:
          HEIGIT_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          if [ -z "$HEIGIT_API_KEY" ]; then
            echo "::error::Repository secret ORS_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions. Do not paste the key into source code or chat."
            exit 1
          fi
          args=()
          case "${{ inputs.route_set }}" in
            cities) args+=(--city-only) ;;
            states) args+=(--state-only) ;;
          esac
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          node tools/fetch_heigit_route_geometries.mjs "${args[@]}"
      - name: Commit generated geometry on a new branch
        id: commit
        run: |
          branch="data/b24-route-geometries-${GITHUB_RUN_NUMBER}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route-geometries
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No geometry files changed; nothing to commit."
            exit 0
          fi
          git commit -m "data: add HeiGIT route geometries for B24"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Generated branch: $branch" >> "$GITHUB_STEP_SUMMARY"
      - name: Open pull request for generated geometry
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE_BRANCH}...${HEAD_BRANCH}?expand=1"
          existing_pr="$(gh pr list --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --json url --jq '.[0].url // empty' || true)"
          if [ -n "$existing_pr" ]; then
            echo "Pull request already exists: $existing_pr"
            echo "PR: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if pr_url="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "data: add HeiGIT route geometries for B24" \
            --body "Adds directional route GeoJSON from HeiGIT ORS Directions V2, with provider distance/duration, stored-distance comparison, source attribution, and CC-BY-SA metadata. Routes exclude Canada. PADD allocation remains subject to TIGER polygon coverage and route-distance QA." 2>&1)"; then
            echo "$pr_url"
            echo "PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Geometry branch was pushed, but automatic PR creation failed. No fetched data was lost."
            echo "$pr_url"
            echo "Automatic PR creation failed. Create a PR from: $compare_url" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch: $HEAD_BRANCH" >> "$GITHUB_STEP_SUMMARY"
            echo "Compare: $compare_url" >> "$GITHUB_STEP_SUMMARY"
          fi
